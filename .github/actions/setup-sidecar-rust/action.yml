name: Setup sidecar Rust toolchain
description: Install the pinned Rust toolchain, configure Swatinem/rust-cache, and install platform-specific native build prerequisites (Linux CMake, Windows libclang).

inputs:
  toolchain:
    description: Rust toolchain version (e.g. 1.94.1).
    required: true
  components:
    description: Comma-separated rustup components (e.g. 'rustfmt, clippy'). Empty for release builds.
    required: false
    default: ''
  cache-workspaces:
    description: Value passed to Swatinem/rust-cache 'workspaces' input.
    required: true
  cache-shared-key:
    description: Value passed to Swatinem/rust-cache 'shared-key' input.
    required: true
  cache-env-vars:
    description: Value passed to Swatinem/rust-cache 'env-vars' input. Default extends defaults with GGML, WHISPER, and CUDA so build-affecting flips (CPU SIMD, whisper flags, CUDA toolkit version) bust the cache.
    required: false
    # CUDA covers CUDA_TOOLKIT_VERSION, exported before this action by the
    # calling release path. The version passed to Jimver/cuda-toolkit is not
    # otherwise visible to rust-cache, so a toolkit bump would restore stale
    # NVCC objects from target-cuda.
    default: 'GGML WHISPER CUDA_TOOLKIT_VERSION'
  cache-on-failure:
    description: Value passed to Swatinem/rust-cache 'cache-on-failure' input.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install native build dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y cmake

    - name: Expose libclang (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: echo "LIBCLANG_PATH=$((Get-Command clang).Source | Split-Path -Parent)" >> $env:GITHUB_ENV

    # ggml refuses to build with MSVC for ARM64, so Windows ARM64 compiles
    # whisper.cpp and llama.cpp with clang-cl. cmake-rs forces -Thost=x64 on the
    # Visual Studio generators, which would pin the MSVC toolset; Ninja skips
    # that, and CC/CXX select the compiler. The ARM64 vcvars environment
    # supplies the MSVC headers, libraries, and linker that clang-cl uses.
    - name: Configure clang-cl toolchain (Windows ARM64)
      if: runner.os == 'Windows' && runner.arch == 'ARM64'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: arm64

    - name: Select clang-cl and Ninja (Windows ARM64)
      if: runner.os == 'Windows' && runner.arch == 'ARM64'
      shell: pwsh
      run: |
        "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
        "CC=clang-cl" >> $env:GITHUB_ENV
        "CXX=clang-cl" >> $env:GITHUB_ENV

    # Fork the rust-cache key by Visual Studio product line (e.g. 2022 vs
    # 2026). cmake configures whisper.cpp's build dir inside target/ with a
    # VS-versioned generator, and CMake hard-fails on a generator mismatch, so
    # a cache built under one VS poisons jobs running under another (runner
    # image migrations flip VS out from under us; see release 2026.6.10).
    # rust-cache hashes CMAKE*-prefixed env vars into the key segment that is
    # also part of its fallback restore prefix, so this blocks stale restores
    # both exact and fuzzy.
    - name: Fork Rust cache key by Visual Studio version (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: echo "CMAKE_VS_PRODUCT_LINE=$(& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property catalog_productLineVersion)" >> $env:GITHUB_ENV

    - name: Setup Rust (with components)
      if: inputs.components != ''
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}

    - name: Setup Rust
      if: inputs.components == ''
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.toolchain }}

    - name: Cache Rust build
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ inputs.cache-workspaces }}
        shared-key: ${{ inputs.cache-shared-key }}
        env-vars: ${{ inputs.cache-env-vars }}
        cache-on-failure: ${{ inputs.cache-on-failure }}
