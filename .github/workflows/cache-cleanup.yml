name: cache-cleanup

# Retain live branches and open PR refs; complete every inventory before deleting.
on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  sweep-orphan-caches:
    runs-on: ubuntu-latest
    steps:
      # Execute trusted default-branch code even when an unmerged PR closes.
      - name: Checkout cleanup script
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node.js
        uses: ./.github/actions/setup-node-npm
        with:
          node-version: 24.22.3

      - name: Delete orphan caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/cleanup-actions-caches.mjs
