name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# PR push storms shouldn't fan out N parallel quality jobs against stale code.
# Cancel any in-flight run for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.14.1
  RUST_TOOLCHAIN: 1.94.1

jobs:
  frontend-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js + npm
        uses: ./.github/actions/setup-node-npm
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'true'
          upgrade-npm: 'true'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Validate release metadata
        run: npm run check:release

      - name: Run frontend quality gates
        run: npm run check:frontend

      - name: Verify frontend build output
        run: npm run verify:frontend-output

  sidecar-quality:
    # Every PR gets one portable native correctness lane. The full platform
    # matrix below runs only after merge or when explicitly dispatched.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # These native-only commands use Node's built-in process APIs to launch
      # Cargo; no package dependency installation, npm cache, or npm upgrade is
      # needed here. frontend-quality remains the JavaScript dependency gate.
      - name: Setup Node.js
        uses: ./.github/actions/setup-node-npm
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: ./.github/actions/setup-sidecar-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          cache-workspaces: native -> target
          cache-shared-key: engine-cohere-transcribe

      # build:sidecar selects gpu-metal on darwin automatically, so this
      # Linux lane verifies the portable CPU binary on every pull request.
      - name: Build sidecar
        run: node scripts/build-sidecar.mjs

      - name: Run Rust quality gates
        run: node scripts/check-rust.mjs

  sidecar-platform-quality:
    # Pull requests use sidecar-quality's Linux lane. main and explicit manual
    # runs expand coverage to the macOS Metal and Windows builds.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust_cache_key: engine-cohere-transcribe-windows
          - os: macos-15
            rust_cache_key: engine-cohere-transcribe-gpu-metal

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: ./.github/actions/setup-node-npm
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: ./.github/actions/setup-sidecar-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          cache-workspaces: native -> target
          cache-shared-key: ${{ matrix.rust_cache_key }}

      # build:sidecar selects gpu-metal on darwin automatically, so this
      # matrix covers the macOS Metal build exactly once after merge.
      - name: Build sidecar
        run: node scripts/build-sidecar.mjs

      - name: Run Rust quality gates
        run: node scripts/check-rust.mjs
