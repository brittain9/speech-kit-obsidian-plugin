name: ci

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# PR push storms shouldn't fan out N parallel quality jobs against stale code.
# Cancel any in-flight run for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.22.3
  RUST_TOOLCHAIN: 1.94.1

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.plan.outputs.native }}
      platform: ${{ steps.plan.outputs.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-npm
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: plan
        name: Select checks from the complete commit diff
        run: node scripts/ci-plan.mjs

  frontend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js + npm
        uses: ./.github/actions/setup-node-npm
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "true"
          upgrade-npm: "true"

      - name: Install JavaScript dependencies
        run: npm ci --engine-strict

      - name: Validate release metadata
        run: npm run check:release

      - name: Run frontend quality gates
        run: npm run check:frontend

      - name: Verify frontend build output
        run: npm run verify:frontend-output

  sidecar-quality:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    # Match the Linux release compiler/glibc floor rather than a moving image.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The production-client integration uses the same executable as the
      # native quality lane, without a second engine build or model download.
      - name: Setup Node.js
        uses: ./.github/actions/setup-node-npm
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "true"
          upgrade-npm: "true"

      - name: Install JavaScript dependencies
        run: npm ci --engine-strict

      - name: Setup Rust
        uses: ./.github/actions/setup-sidecar-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          cache-workspaces: native -> target
          cache-shared-key: engine-cohere-transcribe

      # build:sidecar selects gpu-metal on darwin automatically, so this
      # Linux lane verifies the portable CPU binary on every pull request.
      - name: Build sidecar
        run: node scripts/build-sidecar.mjs

      - name: Run Rust quality gates
        run: node scripts/check-rust.mjs

      - name: Exercise production client against the built sidecar
        run: npm run test:sidecar:client

  sidecar-platform-quality:
    # Native/build changes get platform coverage before merge as well as on main.
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust_cache_key: engine-cohere-transcribe-windows
          - os: macos-15
            rust_cache_key: engine-cohere-transcribe-gpu-metal
          - os: windows-11-arm
            rust_cache_key: engine-cohere-transcribe-windows-arm64
          - os: ubuntu-24.04-arm
            rust_cache_key: engine-cohere-transcribe-linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: ./.github/actions/setup-node-npm
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: ./.github/actions/setup-sidecar-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          cache-workspaces: native -> target
          cache-shared-key: ${{ matrix.rust_cache_key }}

      # build:sidecar selects gpu-metal on darwin automatically, so this
      # matrix validates the same Metal feature graph on macOS.
      - name: Build sidecar
        run: node scripts/build-sidecar.mjs

      - name: Run Rust quality gates
        run: node scripts/check-rust.mjs

  # Preserve the existing required check name without changing repository rules.
  # It now fails unless every job selected by the plan succeeded.
  frontend-quality:
    needs: [changes, frontend-checks, sidecar-quality, sidecar-platform-quality]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-npm
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Require all planned checks
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-plan.mjs --result
