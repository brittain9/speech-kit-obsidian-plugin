name: release

on:
  workflow_dispatch:
  push:
    tags:
      - '[0-9][0-9][0-9][0-9].[0-9]+.[0-9]+'

# Read-only at the top level. Each job opts in to the writes it needs.
permissions:
  contents: read

# Serialize releases for the same ref so a tag re-push or a dry-run racing a
# tag push can't interleave artifact uploads. cancel-in-progress is false —
# half-finished publishes are worse than queueing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      sidecar_version: ${{ steps.sidecar-version.outputs.value }}
      notes_path: ${{ steps.notes.outputs.path }}
      node_version: ${{ steps.build-config.outputs.node-version }}
      rust_toolchain: ${{ steps.build-config.outputs.rust-toolchain }}
      ggml_native: ${{ steps.build-config.outputs.ggml-native }}
      cuda_toolkit_version: ${{ steps.build-config.outputs.cuda-toolkit-version }}
      cuda_architectures: ${{ steps.build-config.outputs.cuda-architectures }}
      windows_cuda_subpackages_manifest: ${{ steps.build-config.outputs.windows-cuda-subpackages-manifest }}
      windows_cuda_rust_cache_env_vars: ${{ steps.build-config.outputs.windows-cuda-rust-cache-env-vars }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Comparing against a prior sidecar tag requires a shared merge base.
          fetch-depth: 0

      - id: build-config
        name: Resolve release build configuration
        uses: ./.github/actions/resolve-release-build-config

      - name: Setup Node.js + npm
        uses: ./.github/actions/setup-node-npm
        with:
          node-version: ${{ steps.build-config.outputs.node-version }}

      - id: version
        name: Resolve release version
        run: echo "value=$(node scripts/read-release-version.mjs)" >> "$GITHUB_OUTPUT"

      - id: sidecar-version
        name: Resolve required sidecar version
        run: echo "value=$(node scripts/read-sidecar-version.mjs)" >> "$GITHUB_OUTPUT"

      - name: Verify referenced sidecar release assets
        if: steps.version.outputs.value != steps.sidecar-version.outputs.value
        env:
          GH_TOKEN: ${{ github.token }}
          SIDECAR_VERSION: ${{ steps.sidecar-version.outputs.value }}
        run: |
          metadata_path="$RUNNER_TEMP/referenced-sidecar-release.json"
          checksums_dir="$RUNNER_TEMP/referenced-sidecar-checksums"
          mkdir -p "$checksums_dir"
          gh release view "$SIDECAR_VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft,assets > "$metadata_path"
          gh release download "$SIDECAR_VERSION" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt --dir "$checksums_dir"
          node scripts/verify-referenced-sidecar-release.mjs --metadata "$metadata_path" --checksums "$checksums_dir/checksums.txt"

      - name: Verify sidecar compatibility boundary
        if: steps.version.outputs.value != steps.sidecar-version.outputs.value
        env:
          SIDECAR_VERSION: ${{ steps.sidecar-version.outputs.value }}
        run: |
          git fetch --no-tags origin "refs/tags/$SIDECAR_VERSION:refs/tags/$SIDECAR_VERSION"
          node scripts/verify-sidecar-compatibility.mjs --base "$SIDECAR_VERSION"

      - name: Validate pushed tag
        if: github.event_name == 'push'
        run: node scripts/read-release-version.mjs --tag "${GITHUB_REF_NAME}"

      - id: notes
        name: Validate release notes
        run: echo "path=$(node scripts/validate-release-notes.mjs --version '${{ steps.version.outputs.value }}')" >> "$GITHUB_OUTPUT"

  plugin-bundle:
    needs: metadata
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js + npm
        uses: ./.github/actions/setup-node-npm
        with:
          node-version: ${{ needs.metadata.outputs.node_version }}
          cache: 'true'
          upgrade-npm: 'true'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build frontend bundle
        run: npm run build:frontend

      - name: Upload plugin bundle
        uses: actions/upload-artifact@v7
        with:
          name: plugin-bundle
          path: |
            main.js
            manifest.json
            styles.css

  build-sidecar-posix:
    # A plugin-only release reuses the last compatible sidecar release and skips
    # every native build. Matching versions declare that this tag publishes a
    # new sidecar set.
    if: needs.metadata.outputs.version == needs.metadata.outputs.sidecar_version
    needs:
      - metadata
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      # These values must exist before rust-cache computes its environment key.
      GGML_NATIVE: ${{ needs.metadata.outputs.ggml_native }}
      CUDA_TOOLKIT_VERSION: ${{ needs.metadata.outputs.cuda_toolkit_version }}
      # Only the CUDA matrix leg consumes this shared release target.
      CMAKE_CUDA_ARCHITECTURES: ${{ matrix.cuda && needs.metadata.outputs.cuda_architectures || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            asset_name: sidecar-macos-arm64
            archive_name: sidecar-macos-arm64.tar.gz
            binary_path: native/target/release/local-dictation-sidecar
            build_command: npm run build:sidecar:release
            cache_workspaces: native -> target
            cuda: false
          - runner: ubuntu-latest
            asset_name: sidecar-linux-x86_64-cpu
            archive_name: sidecar-linux-x86_64-cpu.tar.gz
            binary_path: native/target/release/local-dictation-sidecar
            build_command: npm run build:sidecar:release
            cache_workspaces: native -> target
            cuda: false
          # Stays on 24.04: ort's prebuilt ONNX Runtime needs GCC 14 and glibc
          # 2.38+ to link, so an older image cannot build the sidecar.
          - runner: ubuntu-24.04-arm
            asset_name: sidecar-linux-arm64
            archive_name: sidecar-linux-arm64.tar.gz
            binary_path: native/target/release/local-dictation-sidecar
            build_command: npm run build:sidecar:release
            cache_workspaces: native -> target
            cuda: false
          - runner: ubuntu-latest
            asset_name: sidecar-linux-x86_64-cuda
            archive_name: sidecar-linux-x86_64-cuda.tar.gz
            binary_path: native/target-cuda/release/local-dictation-sidecar
            build_command: npm run build:sidecar:cuda:release
            cache_workspaces: native -> target-cuda
            cuda: true

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js + npm
        uses: ./.github/actions/setup-node-npm
        with:
          node-version: ${{ needs.metadata.outputs.node_version }}

      - name: Setup Rust
        uses: ./.github/actions/setup-sidecar-rust
        with:
          toolchain: ${{ needs.metadata.outputs.rust_toolchain }}
          cache-workspaces: ${{ matrix.cache_workspaces }}
          cache-shared-key: ${{ matrix.asset_name }}
          # Never save a cache from a failed build. A failed CUDA configure would
          # otherwise persist a partial target-cuda tree under an immutable key
          # that no later successful run can overwrite, permanently poisoning the
          # warm-build path (the Windows-CUDA regression in #143).
          cache-on-failure: 'false'

      - name: Install CUDA toolkit
        if: matrix.cuda
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ needs.metadata.outputs.cuda_toolkit_version }}
          method: network

      - name: Build sidecar
        env:
          CARGO_TIMINGS: '1'
        run: ${{ matrix.build_command }}

      - name: Upload cargo timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: timings-${{ matrix.asset_name }}
          path: native/target*/cargo-timings/*.html
          if-no-files-found: ignore

      - name: Ad-hoc sign macOS binary
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - ${{ matrix.binary_path }}
          codesign --force --sign - native/target/release/local-dictation-translation-helper

      - name: Package release archive
        env:
          ARCHIVE_NAME: ${{ matrix.archive_name }}
          ASSET_NAME: ${{ matrix.asset_name }}
          BINARY_PATH: ${{ matrix.binary_path }}
          CUDA: ${{ matrix.cuda }}
        run: node scripts/package-sidecar-archive.mjs

      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/${{ matrix.archive_name }}

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.archive_name }}
          # The archive is already gzip-compressed; the default level-6 zip pass
          # re-deflates high-entropy data for ~zero size gain. Store-only is a
          # faster upload, which matters most for the large CUDA archive. See #143.
          compression-level: 0

  build-sidecar-windows:
    # See build-sidecar-posix: metadata-only dependency, publish keeps the gate.
    if: needs.metadata.outputs.version == needs.metadata.outputs.sidecar_version
    needs:
      - metadata
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            asset_name: sidecar-windows-x86_64-cpu
            archive_name: sidecar-windows-x86_64-cpu.tar.gz
            binary_path: native/target/release/local-dictation-sidecar.exe
            build_command: npm run build:sidecar:release
            cache_workspaces: native -> target
            cuda: false
          - runner: windows-2025
            asset_name: sidecar-windows-x86_64-cuda
            archive_name: sidecar-windows-x86_64-cuda.tar.gz
            binary_path: native/target-cuda/release/local-dictation-sidecar.exe
            cuda: true
          - runner: windows-11-arm
            asset_name: sidecar-windows-arm64
            archive_name: sidecar-windows-arm64.tar.gz
            binary_path: native/target/release/local-dictation-sidecar.exe
            build_command: npm run build:sidecar:release
            cache_workspaces: native -> target
            cuda: false
            msvc_runtime_arch: arm64

    # The x86_64 legs run on windows-2025; the arm64 leg on windows-11-arm.
    # windows-2025 is the Windows Server 2025 image, which now ships Visual
    # Studio 2026 (v18) by default. The pinned toolkit supports MSVC v18 as a
    # host compiler, so the VS CUDA generator works here. We pin
    # this OS label rather than windows-latest for determinism (it won't roll to
    # a future Server major), and deliberately avoid the windows-2025-vs2026
    # alias — that one is testing-only and collapses into windows-2025 after the
    # June 2026 migration. The label still doesn't pin the VS *version* (GitHub
    # migrates VS inside it, as in the 2022->2026 move), so the rust-cache key is
    # forked by VS product line (see setup-sidecar-rust) to survive a future
    # flip. See #139.
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Windows CPU release build
        if: '!matrix.cuda'
        shell: pwsh
        env:
          CUDA_TOOLKIT_VERSION_INPUT: ${{ needs.metadata.outputs.cuda_toolkit_version }}
          GGML_NATIVE_INPUT: ${{ needs.metadata.outputs.ggml_native }}
        run: |
          "GGML_NATIVE=$env:GGML_NATIVE_INPUT" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CUDA_TOOLKIT_VERSION=$env:CUDA_TOOLKIT_VERSION_INPUT" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup Node.js + npm
        if: '!matrix.cuda'
        uses: ./.github/actions/setup-node-npm
        with:
          node-version: ${{ needs.metadata.outputs.node_version }}

      - name: Setup Rust
        if: '!matrix.cuda'
        uses: ./.github/actions/setup-sidecar-rust
        with:
          toolchain: ${{ needs.metadata.outputs.rust_toolchain }}
          cache-workspaces: ${{ matrix.cache_workspaces }}
          cache-shared-key: ${{ matrix.asset_name }}
          # Never save a cache from a failed build. A failed CUDA configure would
          # otherwise persist a partial target-cuda tree under an immutable key
          # that no later successful run can overwrite, permanently poisoning the
          # warm-build path (the Windows-CUDA regression in #143).
          cache-on-failure: 'false'

      - name: Build Windows CUDA release sidecar
        if: matrix.cuda
        uses: ./.github/actions/build-windows-cuda-release
        with:
          node-version: ${{ needs.metadata.outputs.node_version }}
          rust-toolchain: ${{ needs.metadata.outputs.rust_toolchain }}
          ggml-native: ${{ needs.metadata.outputs.ggml_native }}
          cuda-toolkit-version: ${{ needs.metadata.outputs.cuda_toolkit_version }}
          cuda-architectures: ${{ needs.metadata.outputs.cuda_architectures }}
          windows-cuda-subpackages-manifest: ${{ needs.metadata.outputs.windows_cuda_subpackages_manifest }}
          windows-cuda-rust-cache-env-vars: ${{ needs.metadata.outputs.windows_cuda_rust_cache_env_vars }}

      - name: Build sidecar
        if: '!matrix.cuda'
        shell: pwsh
        env:
          CARGO_TIMINGS: '1'
        run: ${{ matrix.build_command }}

      - name: Upload cargo timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: timings-${{ matrix.asset_name }}
          path: native/target*/cargo-timings/*.html
          if-no-files-found: ignore

      - name: Package release archive
        env:
          ARCHIVE_NAME: ${{ matrix.archive_name }}
          ASSET_NAME: ${{ matrix.asset_name }}
          BINARY_PATH: ${{ matrix.binary_path }}
          CUDA: ${{ matrix.cuda }}
          MSVC_RUNTIME_ARCH: ${{ matrix.msvc_runtime_arch }}
        run: node scripts/package-sidecar-archive.mjs

      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/${{ matrix.archive_name }}

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.archive_name }}
          # The archive is already gzip-compressed; the default level-6 zip pass
          # re-deflates high-entropy data for ~zero size gain. Store-only is a
          # faster upload, which matters most for the large CUDA archive. See #143.
          compression-level: 0

  publish:
    needs:
      - metadata
      - plugin-bundle
      - build-sidecar-posix
      - build-sidecar-windows
    # GitHub normally skips a dependent job when any need is skipped. Sidecar
    # jobs are intentionally skipped for plugin-only releases, so allow skipped
    # needs while still refusing any failure or cancellation.
    if: ${{ always() && !failure() && !cancelled() }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js + npm
        uses: ./.github/actions/setup-node-npm
        with:
          node-version: ${{ needs.metadata.outputs.node_version }}

      - name: Download plugin bundle
        uses: actions/download-artifact@v8
        with:
          name: plugin-bundle
          path: dist/plugin-bundle

      - name: Download sidecar archives
        if: needs.metadata.outputs.version == needs.metadata.outputs.sidecar_version
        uses: actions/download-artifact@v8
        with:
          pattern: sidecar-*
          path: dist/release
          merge-multiple: true

      - name: Assemble plugin-only release files
        if: needs.metadata.outputs.version != needs.metadata.outputs.sidecar_version
        run: node scripts/assemble-release-files.mjs

      - name: Assemble release files with sidecars
        if: needs.metadata.outputs.version == needs.metadata.outputs.sidecar_version
        run: node scripts/assemble-release-files.mjs --sidecars

      - name: Upload dry-run bundle
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ needs.metadata.outputs.version }}
          path: dist/release/*

      - name: Create draft release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/release/*
          name: ${{ needs.metadata.outputs.version }}
          tag_name: ${{ needs.metadata.outputs.version }}
          body_path: ${{ needs.metadata.outputs.notes_path }}
          draft: true

      - name: Stage exact release assets for attestation
        if: github.event_name == 'push'
        run: |
          cp dist/release/main.js main.js
          cp dist/release/manifest.json manifest.json
          cp dist/release/styles.css styles.css

      # Sign the exact assembled plugin files after release upload and directly
      # before publication. This keeps the short-lived signing certificate valid
      # when Obsidian's release scanner first sees the assets.
      - name: Attest plugin release assets
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.version }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

  # At-a-glance timing analytics for the run: who took how long, and which steps
  # dominated. It runs after publish so the measured wall clock includes the
  # actual publication path, but it does not gate publication. It also runs
  # after a failed publish so slow/failed runs still leave useful evidence.
  release-report:
    needs:
      - publish
    if: always()
    permissions:
      actions: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - id: build-config
        name: Resolve release build configuration
        uses: ./.github/actions/resolve-release-build-config

      - name: Setup Node.js + npm
        uses: ./.github/actions/setup-node-npm
        with:
          node-version: ${{ steps.build-config.outputs.node-version }}

      - name: Render release timing report
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RELEASE_SECONDS: '1500'
        run: node scripts/release-timing-report.mjs

      - name: Upload release timing report
        uses: actions/upload-artifact@v7
        with:
          name: release-report
          path: release-report.md
